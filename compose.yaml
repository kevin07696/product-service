services:
  product:
    image: product:${VERSION}
    container_name: product_${APP_ENV}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - ${HOST_PORT}:${PORT}
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
    networks:
      - productnet
  postgres:
    image: postgres:latest
    restart: unless-stopped
    container_name: "product-postgres"
    environment:
      POSTGRES_USER: "${DB_USERNAME:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-postgres}"
      POSTGRES_DB: "${DB_DATABASE}"
    volumes:
      - product-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -q -d ${DB_DATABASE} -U ${DB_USERNAME}"
      interval: 30s
      timeout: 10s
      retries: 100
      start_period: 40s
      start_interval: 5s
    ports:
      - "${DB_HOST_PORT}:${DB_PORT}"
    networks:
      - productnet
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "${S3_HOST_PORT}:9000"
      - "${S3_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY}"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - productnet
  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    environment:
    - S3_ENDPOINT=${S3_ENDPOINT}
    - S3_ACCESS_KEY=${S3_ACCESS_KEY}
    - S3_SECRET_KEY=${S3_SECRET_KEY}
    - S3_BUCKET=${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} --no-color;
      mc mb local/${S3_BUCKET};
      mc policy set public local/${S3_BUCKET} --no-color;
      exit 0;
      "    
    networks:
      - productnet

networks:
  productnet:
volumes:
  product-postgres-data:
  minio-data:
